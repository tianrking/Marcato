name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    name: Lint, build, and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Build
        id: verified_build
        run: npm run build

      - name: Unit contracts
        if: ${{ !cancelled() && steps.verified_build.outcome == 'success' }}
        run: npm run test:unit

      - name: Asset storage tests
        if: ${{ !cancelled() && steps.verified_build.outcome == 'success' }}
        run: npm run test:assets

      - name: Editor history and storage tests
        if: ${{ !cancelled() && steps.verified_build.outcome == 'success' }}
        run: npm run test:history

      - name: UI smoke tests
        if: ${{ !cancelled() && steps.verified_build.outcome == 'success' }}
        run: npm run test:smoke

      - name: Share isolation tests
        if: ${{ !cancelled() && steps.verified_build.outcome == 'success' }}
        run: npm run test:share

      - name: Export button tests
        if: ${{ !cancelled() && steps.verified_build.outcome == 'success' }}
        run: npm run test:exports

      - name: WeChat export tests
        if: ${{ !cancelled() && steps.verified_build.outcome == 'success' }}
        run: npm run test:wechat

      - name: PDF pagination tests
        if: ${{ !cancelled() && steps.verified_build.outcome == 'success' }}
        run: npm run test:pdf

      - name: Performance tests
        if: ${{ !cancelled() && steps.verified_build.outcome == 'success' }}
        run: npm run test:perf

      - name: Diagram security tests
        if: ${{ !cancelled() && steps.verified_build.outcome == 'success' }}
        run: npm run test:diagrams

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: marcato-test-artifacts
          path: test-artifacts
          if-no-files-found: ignore
